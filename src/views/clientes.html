<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - Sistema de Ferretería</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <button class="menu-toggle">☰</button>
    
    <nav class="sidebar">
        <div class="sidebar-header">
            <h2>🏪 Ferretería</h2>
            <p>Sistema de Gestión</p>
        </div>
        
        <div class="sidebar-nav">
            <a href="dashboard.html"><i>📊</i> Dashboard</a>
            <a href="categorias.html"><i>📁</i> Categorías</a>
            <a href="proveedores.html"><i>🏢</i> Proveedores</a>
            <a href="clientes.html" class="active"><i>👥</i> Clientes</a>
            <a href="usuarios.html"><i>👤</i> Usuarios</a>
            <a href="productos.html"><i>📦</i> Productos</a>
            <a href="ventas.html"><i>💰</i> Ventas</a>
            <a href="reportes.html"><i>📈</i> Reportes</a>
            <a href="api.html"><i>🔧</i> API Docs</a>
        </div>
    </nav>
    
    <main class="main-content">
        <div class="page-header">
            <h1>👥 Clientes</h1>
            <p>Gestión de clientes</p>
        </div>
        
        <div class="content-card">
            <div class="card-header">
                <h3>Lista de Clientes</h3>
                <div class="card-actions">
                    <input type="text" id="search-cliente" placeholder="Buscar..." oninput="searchClientes()">
                    <button class="btn btn-primary" onclick="openClienteModal()">
                        ➕ Nuevo Cliente
                    </button>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table id="clientes-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>DNI</th>
                                <th>Teléfono</th>
                                <th>Email</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="clientes-tbody">
                            <tr>
                                <td colspan="8" class="loading-spinner">Cargando...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Modal Nuevo/Editar Cliente -->
    <div id="cliente-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="cliente-modal-title">Nuevo Cliente</h3>
                <button class="modal-close" onclick="closeModal('cliente-modal')">×</button>
            </div>
            <div class="modal-body">
                <form id="cliente-form">
                    <input type="hidden" id="cliente-id">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="cliente-nombre">Nombre *</label>
                            <input type="text" id="cliente-nombre" required>
                        </div>
                        <div class="form-group">
                            <label for="cliente-apellido">Apellido</label>
                            <input type="text" id="cliente-apellido">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="cliente-dni">DNI</label>
                            <input type="text" id="cliente-dni">
                        </div>
                        <div class="form-group">
                            <label for="cliente-telefono">Teléfono</label>
                            <input type="text" id="cliente-telefono">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="cliente-email">Email</label>
                        <input type="email" id="cliente-email">
                    </div>
                    <div class="form-group">
                        <label for="cliente-direccion">Dirección</label>
                        <textarea id="cliente-direccion" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-danger" onclick="closeModal('cliente-modal')">Cancelar</button>
                <button class="btn btn-primary" onclick="saveCliente()">Guardar</button>
            </div>
        </div>
    </div>
    
    <script src="/static/js/app.js"></script>
    <script src="/static/js/clientes.js"></script>
</body>
</html>
