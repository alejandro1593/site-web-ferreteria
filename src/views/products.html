<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos Ferretería</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <style>
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }

        .product-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
        }

        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f5f5f5;
        }

        .product-info {
            padding: 15px;
        }

        .product-name {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .product-code {
            font-size: 0.9em;
            color: #667eea;
            font-family: 'Courier New', monospace;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 1.2em;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 10px;
        }

        .product-stock {
            font-size: 0.9em;
            color: #666;
        }

        .stock-low {
            color: #f44336;
            font-weight: bold;
        }

        .category-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.8em;
            color: white;
            margin-bottom: 10px;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #667eea;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }
    </style>
</head>
<body class="standalone-page catalog-page">
    <div class="main-content">
        <div class="page-header">
            <h1>🏪 Catálogo de Productos</h1>
            <p>Explora todos los productos de la ferretería</p>
        </div>

        <div class="content-card">
            <div class="card-header">
                <h4>📊 Información</h4>
                <div class="card-actions">
                    <div class="filter-buttons" id="filter-buttons">
                        <button class="btn btn-primary active" data-category="all">Todos</button>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div id="loading" class="loading">
                    ⏳ Cargando productos...
                </div>

                <div class="products-grid" id="products-grid"></div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/app.js"></script>
    <script src="/static/js/products.js"></script>
</body>
</html>
